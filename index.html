<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Bubble Tim</title>
<style>
/* STYLE : MONDE EN BLOCS */
@import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
:root{
  --ciel:linear-gradient(#79c2ff,#cfe9ff);
  --herbe:#5b9c3f;  --terre:#7c4f2c;  --pierre:#8a8a8a;
  --encre:#2b2b2b;
  --police:'VT323', monospace;
  --arrondi:0px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--ciel);color:var(--encre);font-family:var(--police);
     font-size:22px;image-rendering:pixelated;
     display:flex;flex-direction:column;align-items:center;justify-content:center;
     gap:8px;padding:10px;overflow:hidden;
     -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}

#boite{width:100%;max-width:980px;display:flex;flex-direction:column;gap:8px}

#hud{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:20px}
.jauge{border:4px solid var(--encre);background:#cfcfcf;width:190px;height:26px;
       position:relative;border-radius:0}
.jauge i{display:block;height:100%;width:100%}
.jauge span{position:absolute;left:8px;top:0px;font-size:18px;color:var(--encre)}
#vie i{background:#c0392b}
#nrj i{background:#3d8ad6}
.compteur{border:4px solid var(--encre);background:#e6e0d4;padding:0 10px;
          font-size:20px;line-height:22px;height:26px;display:flex;align-items:center}
.compteur b{color:#7c4f2c;margin-left:6px}

#zonejeu{position:relative;width:100%;border:4px solid var(--encre)}
canvas{display:block;width:100%;height:auto;background:#79c2ff}

#voile{position:absolute;inset:0;background:rgba(43,43,43,.9);
       display:flex;flex-direction:column;align-items:center;justify-content:center;
       gap:14px;text-align:center;padding:16px;color:#fff}
#voile.cache{display:none}
#voile h1{font-size:min(7vw,44px);color:#ffd24a;line-height:1.2;font-weight:normal}
#voile p{font-size:min(3.6vw,24px);line-height:1.5;color:#fff}
#voile .gros{font-size:min(4.4vw,28px);color:#8fe37a}

#pad{display:flex;justify-content:space-between;align-items:center;gap:10px}
.croix{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(3,48px);gap:4px}
.tou{border:4px solid var(--encre);background:var(--pierre);color:var(--encre);
     font-family:var(--police);font-size:24px;border-radius:0;cursor:pointer}
.tou:active{background:var(--herbe)}
#btaper{width:126px;height:100px;font-size:24px;background:var(--terre);color:#ffe9c9}
#btrejouer{height:48px;padding:0 12px;font-size:20px;background:#e6e0d4}
.vide{visibility:hidden;border:none;background:none}
#aide{font-size:18px;line-height:1.2;color:var(--encre);text-align:center}
</style>
</head>
<body>

<div id="boite">

  <div id="hud">
    <div class="jauge" id="vie"><i></i><span>VIE</span></div>
    <div class="jauge" id="nrj"><i></i><span>ENERGIE</span></div>
    <div class="compteur">BULLES <b id="muni">15</b></div>
    <div class="compteur">SCORE <b id="score">0</b></div>
    <div class="compteur" id="msg">STAGE 1</div>
  </div>

  <div id="zonejeu">
    <canvas id="cv" width="960" height="540"></canvas>
    <div id="voile">
      <h1>BUBBLE TIM</h1>
      <p>Fleches ou ZQSD : bouger<br>Espace : tirer une bulle<br>Plus de bulles = la masse<br>R : recommencer</p>
      <p class="gros">Appuie sur une touche</p>
    </div>
  </div>

  <div id="pad">
    <div class="croix">
      <button class="tou vide"></button>
      <button class="tou" data-dir="haut">^</button>
      <button class="tou vide"></button>
      <button class="tou" data-dir="gauche">&lt;</button>
      <button class="tou vide"></button>
      <button class="tou" data-dir="droite">&gt;</button>
      <button class="tou vide"></button>
      <button class="tou" data-dir="bas">v</button>
      <button class="tou vide"></button>
    </div>
    <div style="display:flex;flex-direction:column;gap:8px;align-items:center">
      <button class="tou" id="btaper">TAPER</button>
      <button class="tou" id="btrejouer">REJOUER (R)</button>
    </div>
  </div>

  <div id="aide">Tue les ennemis pour avoir des bulles - ouvre les coffres pour l'energie</div>
</div>

<script>
(function(){
"use strict";

/* ================= BASES ================= */
var cv=document.getElementById('cv'), ctx=cv.getContext('2d');
var W=960,H=540, SOL_HAUT=352, SOL_BAS=506, MONDE=4100;
var elVie=document.querySelector('#vie i'), elNrj=document.querySelector('#nrj i');
var elMuni=document.getElementById('muni'), elScore=document.getElementById('score');
var elMsg=document.getElementById('msg'), voile=document.getElementById('voile');

var C={
  cielHaut:'#79c2ff', cielBas:'#cfe9ff',
  herbe:'#5b9c3f', herbeF:'#417a2c',
  terre:'#7c4f2c', terreF:'#5d3a1f',
  pierre:'#8a8a8a', pierreF:'#6a6a6a', pierreC:'#a5a5a5',
  encre:'#2b2b2b', blanc:'#f2f2ec', route:'#57575e', routeF:'#43434a',
  feu:'#ff8a2b', feu2:'#ffd24a', fumee:'#b9b9b9',
  peau:'#f0c08a', cheveu:'#6b4322',
  bleu:'#3d8ad6', jaune:'#e8c020', rougeT:'#c0392b',
  vert:'#4f9e46', violet:'#8e5fc0', rose:'#ff8ec9', roseF:'#e05fa4',
  eau:'#3fc9d8'
};

/* ================= SON ================= */
var actx=null;
function son(f,d,type,vol){
  try{
    if(!actx) return;
    var o=actx.createOscillator(), g=actx.createGain();
    o.type=type||'square'; o.frequency.value=f;
    g.gain.value=vol||0.05;
    o.connect(g); g.connect(actx.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.0008, actx.currentTime+d);
    o.stop(actx.currentTime+d);
  }catch(e){}
}
function reveilleSon(){ try{ if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }

/* ================= HASARD FIXE ================= */
var graine=987654;
function rnd(){ graine=(graine*1103515245+12345)%2147483648; return graine/2147483648; }

/* ================= DESSIN EN BLOCS ================= */
function bloc(x,y,w,h,col,relief){
  x=Math.round(x); y=Math.round(y); w=Math.round(w); h=Math.round(h);
  if(w<=0||h<=0) return;
  ctx.fillStyle=col; ctx.fillRect(x,y,w,h);
  if(relief!==false){
    ctx.fillStyle='rgba(255,255,255,.20)'; ctx.fillRect(x,y,w,3);
    ctx.fillStyle='rgba(0,0,0,.25)';       ctx.fillRect(x,y+h-3,w,3);
    ctx.fillStyle='rgba(0,0,0,.14)';       ctx.fillRect(x+w-3,y,3,h);
  }
}
function blocNoir(x,y,w,h,col,relief){
  x=Math.round(x); y=Math.round(y); w=Math.round(w); h=Math.round(h);
  ctx.fillStyle=C.encre; ctx.fillRect(x-2,y-2,w+4,h+4);
  bloc(x,y,w,h,col,relief);
}
function pt(x,y,w,h,col){
  ctx.fillStyle=col; ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));
}
function ombreSol(x,y,w){
  ctx.fillStyle='rgba(0,0,0,.30)';
  ctx.fillRect(Math.round(x-w/2),Math.round(y-4),Math.round(w),6);
}
function texte(t,x,y,col,taille,centre){
  ctx.fillStyle=col; ctx.font=taille+"px 'VT323', monospace";
  ctx.textAlign=centre?'center':'left'; ctx.textBaseline='top';
  ctx.fillText(t,Math.round(x),Math.round(y));
}
function texteCadre(t,x,y,col,taille,centre){
  ctx.fillStyle=C.encre; ctx.font=taille+"px 'VT323', monospace";
  ctx.textAlign=centre?'center':'left'; ctx.textBaseline='top';
  for(var dx=-2;dx<=2;dx+=2) for(var dy=-2;dy<=2;dy+=2) ctx.fillText(t,Math.round(x+dx),Math.round(y+dy));
  texte(t,x,y,col,taille,centre);
}

/* ================= ETAT ================= */
var etat, hero, ennemis, bulles, tirs, objets, coffres, decor, portes, cam, score,
    msgTimer, secousse, boss, particules, temps;

var TYPES={
  bleu:   {col:C.bleu,   pv:2, vit:0.95, deg:4,  cd:80,  pts:10, chute:0.60, mode:'melee', nom:'BLEU'},
  jaune:  {col:C.jaune,  pv:3, vit:1.15, deg:6,  cd:70,  pts:20, chute:0.85, mode:'melee', nom:'JAUNE'},
  violet: {col:C.violet, pv:3, vit:1.85, deg:5,  cd:55,  pts:35, chute:0.90, mode:'melee', nom:'VIOLET'},
  vert:   {col:C.vert,   pv:2, vit:0.60, deg:6,  cd:115, pts:30, chute:1.00, mode:'tir',   nom:'VERT'},
  rouge:  {col:C.rougeT, pv:6, vit:0.80, deg:11, cd:72,  pts:50, chute:1.00, mode:'melee', nom:'ROUGE'}
};

function ajouteEnnemi(type,x,y,zone){
  ennemis.push({type:type,x:x,y:y,w:40,h:78,pv:TYPES[type].pv,pvmax:TYPES[type].pv,zone:zone,
                actif:false,cd:40+Math.floor(rnd()*50),flash:0,pousse:0,pas:rnd()*6,frappe:0});
}

function init(){
  graine=987654;
  etat='intro'; cam=0; score=0; msgTimer=0; secousse=0; temps=0;
  hero={x:120,y:450,w:44,h:78,dir:1,vie:100,nrj:100,muni:15,
        inv:0,pousse:0,frappe:0,pas:0,cd:0};
  ennemis=[]; bulles=[]; tirs=[]; objets=[]; coffres=[]; portes=[]; particules=[]; boss=null;

  /* --- zone 0 --- */
  ajouteEnnemi('bleu',560,420,0); ajouteEnnemi('bleu',760,485,0);
  ajouteEnnemi('bleu',960,400,0); ajouteEnnemi('jaune',1090,470,0);
  /* --- zone 1 --- */
  ajouteEnnemi('bleu',1450,410,1);  ajouteEnnemi('violet',1640,490,1);
  ajouteEnnemi('jaune',1860,430,1); ajouteEnnemi('vert',2060,395,1);
  ajouteEnnemi('jaune',2190,480,1); ajouteEnnemi('rouge',2320,440,1);
  /* --- zone 2 --- */
  ajouteEnnemi('violet',2650,420,2); ajouteEnnemi('jaune',2820,495,2);
  ajouteEnnemi('vert',2980,390,2);   ajouteEnnemi('rouge',3120,470,2);
  ajouteEnnemi('violet',3260,420,2); ajouteEnnemi('vert',3360,500,2);

  portes=[{x:1240,zone:0,ouverte:false},{x:2440,zone:1,ouverte:false},{x:3560,zone:2,ouverte:false}];

  var cx=[700,1560,2120,2560,2900,3300,3760], cy=[500,395,485,410,405,495,470];
  for(var i=0;i<cx.length;i++) coffres.push({x:cx[i],y:cy[i],ouvert:0});
  objets.push({x:3680,y:430,vie:1e9,saut:0});
  objets.push({x:3720,y:500,vie:1e9,saut:2});

  /* ---- decor ---- */
  decor={loin:[],pres:[],nuages:[],sol:[],feux:[],epaves:[]};
  var x=0;
  while(x<MONDE+900){
    var hh=140+rnd()*190, ww=100+rnd()*90;
    decor.loin.push({x:x,w:ww,h:hh,casse:Math.floor(rnd()*3),
                     col:rnd()>0.5?'#7f8a9c':'#6d7789', fen:Math.floor(rnd()*3)});
    x+=ww+18+rnd()*40;
  }
  x=-60;
  while(x<MONDE+900){
    var h2=90+rnd()*170, w2=110+rnd()*110;
    decor.pres.push({x:x,w:w2,h:h2,pal:rnd(),trou:rnd()>0.45,etages:Math.max(2,Math.floor(h2/44)),
                     effondre:rnd()>0.72});
    x+=w2+40+rnd()*90;
  }
  x=60;
  while(x<MONDE+900){ decor.nuages.push({x:x,y:26+rnd()*70,w:70+rnd()*70,h:18+rnd()*10}); x+=280+rnd()*260; }
  for(var j=0;j<210;j++){
    decor.sol.push({x:rnd()*(MONDE+400), y:SOL_HAUT+14+rnd()*(SOL_BAS-SOL_HAUT+18),
                    s:6+rnd()*14, t:Math.floor(rnd()*4)});
  }
  for(var f=0;f<16;f++) decor.feux.push({x:200+rnd()*(MONDE-200), y:SOL_HAUT-6+rnd()*30, s:0.7+rnd()*0.8});
  for(var e2=0;e2<14;e2++) decor.epaves.push({x:260+rnd()*(MONDE-300), y:SOL_HAUT+8+rnd()*120,
                                              col:rnd()>0.5?'#9c4b4b':'#4b6b9c', sens:rnd()>0.5?1:-1});
  majHud();
}

/* ================= ENTREES ================= */
var touches={}, attaqueDemandee=false;
function nomTouche(k){
  k=k.toLowerCase();
  if(k==='arrowleft'||k==='q'||k==='a') return 'gauche';
  if(k==='arrowright'||k==='d') return 'droite';
  if(k==='arrowup'||k==='z'||k==='w') return 'haut';
  if(k==='arrowdown'||k==='s') return 'bas';
  if(k===' '||k==='enter') return 'taper';
  if(k==='r') return 'rejouer';
  return null;
}
document.addEventListener('keydown',function(e){
  reveilleSon();
  var n=nomTouche(e.key);
  if(n) e.preventDefault();
  if(etat==='intro'){ voile.classList.add('cache'); etat='jeu'; return; }
  if(n==='rejouer'){ init(); voile.classList.add('cache'); etat='jeu'; return; }
  if(n==='taper'){ if(!e.repeat) attaqueDemandee=true; return; }
  if(n) touches[n]=true;
});
document.addEventListener('keyup',function(e){
  var n=nomTouche(e.key); if(n) touches[n]=false;
});
function brancheTouche(el,nom){
  function on(e){ e.preventDefault(); reveilleSon();
    if(etat==='intro'){ voile.classList.add('cache'); etat='jeu'; }
    if(nom==='taper') attaqueDemandee=true; else touches[nom]=true; }
  function off(e){ e.preventDefault(); if(nom!=='taper') touches[nom]=false; }
  el.addEventListener('pointerdown',on);
  el.addEventListener('pointerup',off);
  el.addEventListener('pointerleave',off);
  el.addEventListener('pointercancel',off);
  el.addEventListener('contextmenu',function(e){e.preventDefault();});
}
var boutonsDir=document.querySelectorAll('[data-dir]');
for(var i=0;i<boutonsDir.length;i++) brancheTouche(boutonsDir[i],boutonsDir[i].getAttribute('data-dir'));
brancheTouche(document.getElementById('btaper'),'taper');
document.getElementById('btrejouer').addEventListener('click',function(){
  reveilleSon(); init(); voile.classList.add('cache'); etat='jeu';
});
voile.addEventListener('pointerdown',function(){
  reveilleSon();
  if(etat==='intro'){ voile.classList.add('cache'); etat='jeu'; }
  else if(etat==='gagne'||etat==='perdu'){ init(); voile.classList.add('cache'); etat='jeu'; }
});

/* ================= HUD ================= */
function majHud(){
  elVie.style.width=Math.max(0,hero.vie)+'%';
  elNrj.style.width=Math.max(0,hero.nrj)+'%';
  elMuni.textContent=hero.muni>0?hero.muni:'MASSE';
  elScore.textContent=score;
}
function message(t){ elMsg.textContent=t; msgTimer=170; }

/* ================= OUTILS ================= */
function porteActive(){
  for(var i=0;i<portes.length;i++) if(!portes[i].ouverte) return portes[i];
  return null;
}
function zoneVide(z){
  if(z===2 && boss && boss.pv>0) return false;
  for(var i=0;i<ennemis.length;i++) if(ennemis[i].zone===z) return false;
  return true;
}
function poussiere(x,y,col,n){
  for(var i=0;i<n;i++){
    particules.push({x:x,y:y-30,vx:(Math.random()-0.5)*3.2,vy:-Math.random()*2.6,
                     vie:22+Math.random()*14,s:4+Math.random()*5,col:col});
  }
}

/* ================= ACTIONS ================= */
function attaque(){
  if(etat!=='jeu' || hero.cd>0) return;
  if(hero.muni>0){
    hero.muni--; hero.cd=14; hero.frappe=6;
    bulles.push({x:hero.x+hero.dir*26, y:hero.y-40, vx:hero.dir*9.5, vie:130});
    son(760,0.08,'square',0.05);
  }else{
    hero.cd=30; hero.frappe=17;
    son(150,0.14,'sawtooth',0.06);
    for(var i=ennemis.length-1;i>=0;i--){
      var e=ennemis[i];
      if(Math.abs(e.y-hero.y)<28 && (e.x-hero.x)*hero.dir>0 && Math.abs(e.x-hero.x)<64) blesseEnnemi(i,2,hero.dir*7);
    }
    if(boss && boss.pv>0 && Math.abs(boss.y-hero.y)<44 && (boss.x-hero.x)*hero.dir>0 && Math.abs(boss.x-hero.x)<96)
      blesseBoss(2);
    for(var c=0;c<coffres.length;c++){
      var cf=coffres[c];
      if(!cf.ouvert && Math.abs(cf.y-hero.y)<28 && Math.abs(cf.x-hero.x)<66) ouvreCoffre(cf);
    }
  }
  majHud();
}
function blesseEnnemi(idx,deg,pousse){
  var e=ennemis[idx];
  e.pv-=deg; e.flash=8; e.pousse=pousse; e.actif=true;
  poussiere(e.x,e.y,TYPES[e.type].col,4);
  if(e.pv<=0){
    score+=TYPES[e.type].pts;
    son(220,0.16,'square',0.05);
    poussiere(e.x,e.y,TYPES[e.type].col,10);
    if(rnd()<TYPES[e.type].chute) objets.push({x:e.x,y:e.y,vie:1200,saut:0});
    ennemis.splice(idx,1);
    secousse=6;
  }else son(420,0.05,'square',0.04);
  majHud();
}
function blesseBoss(deg){
  boss.pv-=deg; boss.flash=9;
  poussiere(boss.x,boss.y-20,C.rose,6);
  son(300,0.08,'square',0.05);
  if(boss.pv<=0){
    boss.pv=0; score+=400; secousse=18;
    poussiere(boss.x,boss.y-10,C.rose,26);
    son(160,0.6,'sawtooth',0.07);
    message('LE CHAT ROSE EST BATTU !');
    majHud();
  }
}
function ouvreCoffre(cf){
  cf.ouvert=1;
  hero.nrj=Math.min(100,hero.nrj+50);
  score+=5;
  poussiere(cf.x,cf.y,C.terre,8);
  message('ENERGIE +50');
  son(880,0.12,'triangle',0.06); son(1180,0.14,'triangle',0.05);
  majHud();
}

/* ================= MISE A JOUR ================= */
function maj(dt){
  temps+=dt;
  if(etat!=='jeu') return;
  if(msgTimer>0){ msgTimer-=dt; if(msgTimer<=0) elMsg.textContent='STAGE 1'; }
  if(secousse>0) secousse-=dt;

  /* --- hero --- */
  var vx=0, vy=0;
  if(touches.gauche) vx-=1;
  if(touches.droite) vx+=1;
  if(touches.haut) vy-=1;
  if(touches.bas) vy+=1;
  if(vx!==0) hero.dir=vx>0?1:-1;
  var bouge=(vx!==0||vy!==0);
  if(bouge && hero.nrj>0){
    var norm=(vx!==0&&vy!==0)?0.72:1;
    hero.x+=vx*2.6*norm*dt; hero.y+=vy*1.8*norm*dt;
    hero.pas+=0.34*dt; hero.nrj-=0.045*dt; if(hero.nrj<0) hero.nrj=0;
  }else if(bouge){
    hero.x+=vx*1.1*dt; hero.y+=vy*0.8*dt; hero.pas+=0.18*dt;
  }
  if(hero.nrj<=0){
    hero.vie-=0.05*dt;
    if(Math.floor(Date.now()/400)%2===0 && msgTimer<=0) elMsg.textContent='PLUS D ENERGIE !';
  }
  if(hero.pousse!==0){ hero.x+=hero.pousse*dt; hero.pousse*=0.82; if(Math.abs(hero.pousse)<0.2) hero.pousse=0; }
  if(hero.cd>0) hero.cd-=dt;
  if(hero.frappe>0) hero.frappe-=dt;
  if(hero.inv>0) hero.inv-=dt;

  /* --- apparition du boss --- */
  if(!boss && hero.x>3480){
    boss={x:3880,y:450,w:120,h:112,pv:20,pvmax:20,cd:120,tirCd:200,flash:0,pas:0,pousse:0,charge:0};
    message('LE CHAT ROSE !');
    son(200,0.4,'sawtooth',0.06);
  }

  /* --- portes --- */
  var pa=porteActive();
  var limite=MONDE-40;
  if(pa && !zoneVide(pa.zone)) limite=pa.x-30;
  else if(pa && zoneVide(pa.zone)){
    pa.ouverte=true; message('LA VOIE EST LIBRE !'); son(600,0.2,'triangle',0.05);
  }
  if(hero.x<40) hero.x=40;
  if(hero.x>limite) hero.x=limite;
  if(hero.y<SOL_HAUT) hero.y=SOL_HAUT;
  if(hero.y>SOL_BAS) hero.y=SOL_BAS;

  if(attaqueDemandee){ attaque(); attaqueDemandee=false; }

  var camMax=Math.max(0,limite+60-W);
  cam=Math.max(0,Math.min(camMax,hero.x-380));

  /* --- bulles du hero --- */
  for(var b=bulles.length-1;b>=0;b--){
    var bu=bulles[b]; bu.x+=bu.vx*dt; bu.vie-=dt;
    var touche=false;
    for(var i2=ennemis.length-1;i2>=0;i2--){
      var e2=ennemis[i2];
      if(Math.abs(bu.x-e2.x)<e2.w/2+8 && Math.abs(bu.y-(e2.y-34))<26){
        blesseEnnemi(i2,1,(bu.vx>0?1:-1)*4); touche=true; break;
      }
    }
    if(!touche && boss && boss.pv>0 && Math.abs(bu.x-boss.x)<boss.w/2 && Math.abs(bu.y-(boss.y-boss.h/2))<boss.h/2){
      blesseBoss(1); touche=true;
    }
    if(!touche){
      for(var c3=0;c3<coffres.length;c3++){
        var cf3=coffres[c3];
        if(!cf3.ouvert && Math.abs(bu.x-cf3.x)<28 && Math.abs(bu.y-(cf3.y-20))<26){ ouvreCoffre(cf3); touche=true; break; }
      }
    }
    if(touche||bu.vie<=0||bu.x<cam-80||bu.x>cam+W+80) bulles.splice(b,1);
  }

  /* --- tirs ennemis --- */
  for(var t2=tirs.length-1;t2>=0;t2--){
    var ti=tirs[t2];
    ti.x+=ti.vx*dt; ti.y+=(ti.vy||0)*dt; ti.vie-=dt; ti.rot=(ti.rot||0)+0.2*dt;
    if(hero.inv<=0 && Math.abs(ti.x-hero.x)<26 && Math.abs(ti.y-(hero.y-40))<30){
      hero.vie-=ti.deg; hero.inv=45; hero.pousse=(ti.vx>0?1:-1)*3.5; secousse=7;
      poussiere(hero.x,hero.y,C.blanc,6);
      son(120,0.14,'sawtooth',0.06); majHud();
      tirs.splice(t2,1); continue;
    }
    if(ti.vie<=0||ti.x<cam-90||ti.x>cam+W+90) tirs.splice(t2,1);
  }

  /* --- ennemis --- */
  for(var i=0;i<ennemis.length;i++){
    var e=ennemis[i], t=TYPES[e.type];
    if(!e.actif && Math.abs(e.x-hero.x)<540) e.actif=true;
    if(e.flash>0) e.flash-=dt;
    if(e.frappe>0) e.frappe-=dt;
    if(e.pousse!==0){ e.x+=e.pousse*dt; e.pousse*=0.8; if(Math.abs(e.pousse)<0.2) e.pousse=0; }
    if(!e.actif) continue;
    if(e.cd>0) e.cd-=dt;
    var dx=hero.x-e.x, dy=hero.y-e.y;

    if(t.mode==='tir'){
      /* garde ses distances et tire */
      var dist=Math.abs(dx);
      if(dist<190) e.x-=(dx>0?1:-1)*t.vit*1.3*dt;
      else if(dist>320) e.x+=(dx>0?1:-1)*t.vit*dt;
      if(Math.abs(dy)>10) e.y+=(dy>0?1:-1)*t.vit*0.8*dt;
      e.pas+=0.16*dt;
      if(e.cd<=0 && dist<430 && Math.abs(dy)<26){
        e.cd=t.cd; e.frappe=12;
        tirs.push({x:e.x+(dx>0?26:-26), y:e.y-40, vx:(dx>0?1:-1)*5.2, vy:0, deg:t.deg, vie:180, type:'caillou'});
        son(300,0.08,'square',0.04);
      }
    }else{
      var loin=Math.abs(dx)>34 || Math.abs(dy)>12;
      if(loin){
        if(Math.abs(dx)>32) e.x+=(dx>0?1:-1)*t.vit*dt;
        if(Math.abs(dy)>8)  e.y+=(dy>0?1:-1)*t.vit*0.65*dt;
        e.pas+=0.2*dt;
      }else if(e.cd<=0){
        e.cd=t.cd; e.frappe=12;
        if(hero.inv<=0){
          hero.vie-=t.deg; hero.inv=45; hero.pousse=(dx>0?1:-1)*4.5; secousse=8;
          poussiere(hero.x,hero.y,C.blanc,5);
          son(120,0.16,'sawtooth',0.06); majHud();
        }
      }
    }
    for(var k=0;k<ennemis.length;k++){
      if(k===i) continue;
      var o=ennemis[k];
      if(Math.abs(o.x-e.x)<28 && Math.abs(o.y-e.y)<14) e.x+=(e.x<o.x?-0.6:0.6)*dt;
    }
    if(e.y<SOL_HAUT) e.y=SOL_HAUT;
    if(e.y>SOL_BAS) e.y=SOL_BAS;
  }

  /* --- boss chat rose --- */
  if(boss && boss.pv>0){
    if(boss.flash>0) boss.flash-=dt;
    if(boss.cd>0) boss.cd-=dt;
    if(boss.tirCd>0) boss.tirCd-=dt;
    if(boss.pousse!==0){ boss.x+=boss.pousse*dt; boss.pousse*=0.85; if(Math.abs(boss.pousse)<0.2) boss.pousse=0; }
    var bdx=hero.x-boss.x, bdy=hero.y-boss.y;
    if(boss.charge>0){
      boss.charge-=dt;
      boss.x+=(boss.dirCharge)*4.2*dt;
      boss.pas+=0.5*dt;
      if(Math.abs(bdx)<70 && Math.abs(bdy)<38 && hero.inv<=0){
        hero.vie-=13; hero.inv=50; hero.pousse=(bdx>0?1:-1)*7; secousse=12;
        son(100,0.2,'sawtooth',0.07); majHud();
      }
    }else{
      if(Math.abs(bdx)>64) boss.x+=(bdx>0?1:-1)*1.05*dt;
      if(Math.abs(bdy)>10) boss.y+=(bdy>0?1:-1)*0.75*dt;
      boss.pas+=0.16*dt;
      if(boss.cd<=0 && Math.abs(bdx)<80 && Math.abs(bdy)<36){
        boss.cd=80;
        if(hero.inv<=0){
          hero.vie-=12; hero.inv=48; hero.pousse=(bdx>0?1:-1)*6; secousse=10;
          son(110,0.18,'sawtooth',0.06); majHud();
        }
      }
      if(boss.tirCd<=0){
        boss.tirCd=220;
        var sens=bdx>0?1:-1;
        for(var p=-1;p<=1;p++){
          tirs.push({x:boss.x+sens*40, y:boss.y-70, vx:sens*5.4, vy:p*1.1, deg:8, vie:190, type:'pelote'});
        }
        son(500,0.12,'square',0.05);
        if(Math.abs(bdx)>200){ boss.charge=48; boss.dirCharge=sens; }
      }
    }
    if(boss.x<3320) boss.x=3320;
    if(boss.x>MONDE-60) boss.x=MONDE-60;
    if(boss.y<SOL_HAUT+10) boss.y=SOL_HAUT+10;
    if(boss.y>SOL_BAS) boss.y=SOL_BAS;
  }

  /* --- objets --- */
  for(var o2=objets.length-1;o2>=0;o2--){
    var ob=objets[o2];
    ob.vie-=dt; ob.saut+=0.15*dt;
    if(Math.abs(ob.x-hero.x)<34 && Math.abs(ob.y-hero.y)<28){
      hero.muni+=5; score+=5; message('BULLES +5');
      son(980,0.09,'square',0.05); majHud();
      objets.splice(o2,1); continue;
    }
    if(ob.vie<=0) objets.splice(o2,1);
  }
  for(var c2=0;c2<coffres.length;c2++){
    var cf2=coffres[c2];
    if(!cf2.ouvert && Math.abs(cf2.x-hero.x)<34 && Math.abs(cf2.y-hero.y)<26) ouvreCoffre(cf2);
  }

  /* --- particules --- */
  for(var pa2=particules.length-1;pa2>=0;pa2--){
    var pp=particules[pa2];
    pp.x+=pp.vx*dt; pp.y+=pp.vy*dt; pp.vy+=0.18*dt; pp.vie-=dt;
    if(pp.vie<=0) particules.splice(pa2,1);
  }
  if(particules.length>140) particules.splice(0,particules.length-140);

  /* --- fin --- */
  if(hero.vie<=0){ hero.vie=0; etat='perdu'; finEcran(false); }
  else if(boss && boss.pv<=0 && hero.x>MONDE-120){ etat='gagne'; finEcran(true); }
  majHud();
}

function finEcran(gagne){
  voile.classList.remove('cache');
  voile.innerHTML = gagne
    ? '<h1>BUBBLE TIM A GAGNE !</h1><p>Le chat rose est battu<br>Score : '+score+'</p><p class="gros">Appuie sur R</p>'
    : '<h1 style="color:#ff7a6b">TIM EST TOMBE</h1><p>Score : '+score+'</p><p class="gros">Appuie sur R</p>';
  son(gagne?880:110, 0.5, gagne?'triangle':'sawtooth', 0.07);
}

/* ================= PERSONNAGES ================= */
function dessinePerso(x,y,w,h,colHaut,dir,pas,flash,estHero,frappe){
  var bal=Math.sin(pas)*8;
  ombreSol(x,y,w+16);
  var gx=x-w/2;
  var hTete=Math.round(w*0.62);
  var yTete=y-h;
  var yTorse=yTete+hTete+2;
  var hTorse=Math.round(h*0.40);
  var yJambes=yTorse+hTorse;

  var cShirt = flash>0 ? C.blanc : colHaut;
  var cPant  = flash>0 ? C.blanc : C.encre;

  /* jambes cubiques alternees */
  var j1=Math.max(0,bal), j2=Math.max(0,-bal);
  blocNoir(gx+5, yJambes, 13, (y-yJambes)-j1, cPant);
  blocNoir(gx+w-18, yJambes, 13, (y-yJambes)-j2, cPant);
  /* chaussures */
  bloc(gx+3, y-(j1)-8, 17, 8, C.terreF);
  bloc(gx+w-20, y-(j2)-8, 17, 8, C.terreF);

  /* torse */
  blocNoir(gx, yTorse, w, hTorse, cShirt);
  /* ceinture + col */
  pt(gx, yTorse+hTorse-8, w, 6, 'rgba(0,0,0,.35)');
  pt(gx+w*0.28, yTorse, w*0.44, 5, 'rgba(255,255,255,.35)');
  /* poche */
  pt(gx+ (dir>0? w-16 : 6), yTorse+12, 10, 10, 'rgba(0,0,0,.18)');

  /* tete */
  blocNoir(gx+Math.round((w-hTete)/2), yTete, hTete, hTete, flash>0?C.blanc:C.peau);
  var tx=gx+Math.round((w-hTete)/2);
  /* cheveux (casquette de blocs) */
  pt(tx, yTete, hTete, 8, estHero?C.cheveu:C.encre);
  pt(tx-3, yTete+2, hTete+6, 4, estHero?C.cheveu:C.encre);
  /* yeux */
  var ex=dir>0?4:-4;
  pt(tx+hTete*0.24+ex, yTete+hTete*0.42, 5, 6, C.encre);
  pt(tx+hTete*0.62+ex, yTete+hTete*0.42, 5, 6, C.encre);
  /* bouche */
  pt(tx+hTete*0.36+ex, yTete+hTete*0.72, 9, 3, 'rgba(0,0,0,.45)');

  if(estHero){
    /* gobelet de bubble tea, sans bras */
    var bx = dir>0 ? gx+w+3 : gx-25;
    var by = yTorse+8 - (frappe>0?6:0);
    blocNoir(bx, by, 22, 30, C.blanc);
    pt(bx+2, by+14, 18, 14, C.rose);
    pt(bx+4, by+22, 5, 5, C.encre);
    pt(bx+12, by+20, 5, 5, C.encre);
    pt(bx+8, by-14, 6, 16, C.eau);        /* paille */
    pt(bx, by+8, 22, 4, 'rgba(0,0,0,.25)');
  }
}

function dessineBoss(){
  var x=boss.x-cam, y=boss.y;
  var flott=Math.sin(boss.pas)*4;
  ombreSol(x,y,boss.w+20);
  var corpsH=64, corpsW=boss.w, corpsY=y-corpsH+flott;
  var cRose = boss.flash>0 ? C.blanc : C.rose;

  /* queue en escalier */
  var sens = hero.x>boss.x ? -1 : 1;
  for(var q=0;q<4;q++){
    pt(x+sens*(corpsW/2+6+q*14), corpsY+18-q*14+Math.sin(boss.pas+q)*4, 16,16, C.roseF);
  }
  /* corps */
  blocNoir(x-corpsW/2, corpsY, corpsW, corpsH, cRose);
  /* rayures */
  pt(x-corpsW/2+14, corpsY+10, 12, corpsH-24, C.roseF);
  pt(x-corpsW/2+42, corpsY+10, 12, corpsH-24, C.roseF);
  pt(x-corpsW/2+70, corpsY+10, 12, corpsH-24, C.roseF);
  /* pattes */
  blocNoir(x-corpsW/2+8, y-16+flott, 24, 16, C.roseF);
  blocNoir(x+corpsW/2-32, y-16+flott, 24, 16, C.roseF);

  /* tete */
  var tW=76, tX=x-tW/2, tY=corpsY-64;
  /* oreilles en blocs */
  pt(tX+6, tY-16, 18, 18, cRose);
  pt(tX+tW-24, tY-16, 18, 18, cRose);
  pt(tX+11, tY-10, 8, 10, C.roseF);
  pt(tX+tW-19, tY-10, 8, 10, C.roseF);
  blocNoir(tX, tY, tW, 64, cRose);
  /* yeux mechants */
  pt(tX+12, tY+18, 18, 16, C.blanc);
  pt(tX+tW-30, tY+18, 18, 16, C.blanc);
  var vx2 = hero.x>boss.x ? 6 : 0;
  pt(tX+16+vx2, tY+22, 8, 12, C.encre);
  pt(tX+tW-26+vx2, tY+22, 8, 12, C.encre);
  /* museau + moustaches */
  pt(tX+28, tY+42, 20, 10, C.blanc);
  pt(tX+34, tY+40, 8, 6, C.roseF);
  pt(tX-14, tY+40, 16, 3, C.encre);
  pt(tX-14, tY+48, 16, 3, C.encre);
  pt(tX+tW-2, tY+40, 16, 3, C.encre);
  pt(tX+tW-2, tY+48, 16, 3, C.encre);
  /* dents */
  pt(tX+30, tY+52, 5, 7, C.blanc);
  pt(tX+41, tY+52, 5, 7, C.blanc);

  /* barre de vie du boss */
  var bw=420, bx2=(W-bw)/2;
  pt(bx2-4, 16, bw+8, 30, C.encre);
  pt(bx2, 20, bw, 22, '#5a5a5a');
  pt(bx2, 20, bw*Math.max(0,boss.pv)/boss.pvmax, 22, C.rose);
  texteCadre('LE CHAT ROSE', W/2, 46, C.blanc, 26, true);
}

/* ================= DECOR ================= */
function dessineMonde(){
  var sx = secousse>0 ? (Math.random()*7-3.5) : 0;
  var sy = secousse>0 ? (Math.random()*5-2.5) : 0;
  ctx.save(); ctx.translate(Math.round(sx),Math.round(sy));

  /* ciel */
  var g=ctx.createLinearGradient(0,0,0,SOL_HAUT);
  g.addColorStop(0,C.cielHaut); g.addColorStop(1,C.cielBas);
  ctx.fillStyle=g; ctx.fillRect(-10,-10,W+20,SOL_HAUT+12);

  /* soleil carre */
  pt(W-150-cam*0.04, 44, 56, 56, '#fff0a8');
  pt(W-142-cam*0.04, 52, 40, 40, '#ffe45c');

  /* nuages rectangulaires */
  for(var n=0;n<decor.nuages.length;n++){
    var nu=decor.nuages[n], nx=nu.x-cam*0.12;
    if(nx>W+140||nx+nu.w<-140) continue;
    pt(nx,nu.y,nu.w,nu.h,'#ffffff');
    pt(nx+16,nu.y-nu.h*0.6,nu.w*0.5,nu.h*0.7,'#ffffff');
    pt(nx+8,nu.y+nu.h,nu.w*0.7,6,'rgba(0,0,0,.06)');
  }

  /* ville detruite : silhouettes lointaines */
  for(var i=0;i<decor.loin.length;i++){
    var d=decor.loin[i], x=d.x-cam*0.25;
    if(x>W+200||x+d.w<-200) continue;
    var top=SOL_HAUT-d.h;
    pt(x,top,d.w,d.h,d.col);
    /* sommet casse en escalier */
    if(d.casse===0){ pt(x,top,d.w*0.4,20,C.cielBas); pt(x+d.w*0.4,top,d.w*0.25,10,C.cielBas); }
    else if(d.casse===1){ pt(x+d.w*0.55,top,d.w*0.45,26,C.cielBas); pt(x+d.w*0.35,top,d.w*0.2,12,C.cielBas); }
    else { pt(x,top,d.w*0.2,14,C.cielBas); pt(x+d.w*0.72,top,d.w*0.28,18,C.cielBas); }
    /* fenetres */
    for(var fy=top+24; fy<SOL_HAUT-20; fy+=26){
      for(var fx=x+10; fx<x+d.w-14; fx+=24){
        pt(fx,fy,12,14, (Math.floor(fx+fy)%97<40)?'#3a4250':'#59636f');
      }
    }
    /* trous d obus */
    if(d.fen===1) pt(x+d.w*0.3, top+d.h*0.4, 34, 30, C.cielBas);
    if(d.fen===2){ pt(x+d.w*0.55, top+d.h*0.25, 26, 24, C.cielBas); pt(x+8, top+d.h*0.6, 20, 20, C.cielBas); }
  }

  /* immeubles proches en blocs */
  for(var j=0;j<decor.pres.length;j++){
    var p=decor.pres[j], px2=p.x-cam*0.62;
    if(px2>W+240||px2+p.w<-240) continue;
    var top2=SOL_HAUT-p.h;
    var mur = p.pal>0.5?'#9c8b73':'#8f8f8f';
    var murF = p.pal>0.5?'#7b6c58':'#6f6f6f';
    /* corps du batiment brique par brique */
    for(var by=top2; by<SOL_HAUT; by+=22){
      for(var bx=px2; bx<px2+p.w; bx+=34){
        var dec=((Math.floor(by/22)%2)===0)?0:17;
        var lg=Math.min(32, px2+p.w-(bx+dec));
        if(lg>4) pt(bx+dec, by, lg, 20, ((bx+by)%77<30)?murF:mur);
      }
    }
    /* etage effondre : on ouvre le haut */
    if(p.effondre){
      pt(px2, top2, p.w*0.5, 34, C.cielBas);
      pt(px2+p.w*0.5, top2, p.w*0.2, 16, C.cielBas);
      /* poutres qui depassent */
      for(var r=0;r<4;r++) pt(px2+p.w*0.5+r*10, top2+30-r*4, 5, 22, '#5b4a3a');
    }
    /* fenetres cassees */
    for(var ey=top2+34; ey<SOL_HAUT-30; ey+=44){
      for(var ex2=px2+18; ex2<px2+p.w-30; ex2+=56){
        pt(ex2,ey,32,28,'#2f3540');
        pt(ex2+4,ey+4,10,10,'#6d7a86');
        pt(ex2+18,ey+16,8,8,'#6d7a86');
        pt(ex2-3,ey-3,38,4,murF);
      }
    }
    /* porte */
    pt(px2+p.w*0.42, SOL_HAUT-46, 34, 46, '#3a2d22');
    pt(px2+p.w*0.42, SOL_HAUT-46, 34, 5, murF);
    /* trou dans le mur */
    if(p.trou){
      pt(px2+p.w*0.16, SOL_HAUT-70, 44, 70, '#2f3540');
      pt(px2+p.w*0.16-6, SOL_HAUT-70, 12, 22, mur);
      pt(px2+p.w*0.16+38, SOL_HAUT-52, 12, 18, mur);
    }
  }

  /* fumee des incendies (derriere la route) */
  for(var s2=0;s2<decor.feux.length;s2++){
    var fu=decor.feux[s2], fx2=fu.x-cam*0.62;
    if(fx2<-90||fx2>W+90) continue;
    for(var m=0;m<5;m++){
      var mv=(temps*0.5+m*22+fu.x)%150;
      pt(fx2-10+Math.sin((temps*0.02)+m)*10, SOL_HAUT-24-mv, 18+m*3, 16, 'rgba(120,120,120,'+(0.30-m*0.05)+')');
    }
  }

  /* --- la route --- */
  pt(-10,SOL_HAUT,W+20,H-SOL_HAUT+12,C.route);
  pt(-10,SOL_HAUT,W+20,6,'#6b6b74');
  /* dalles */
  for(var dy2=SOL_HAUT+10; dy2<H+10; dy2+=26){
    for(var dx2=Math.floor(cam/40)*40; dx2<cam+W+40; dx2+=40){
      var sxx=dx2-cam+((Math.floor(dy2/26)%2)?20:0);
      pt(sxx, dy2, 36, 22, ((dx2+dy2)%61<26)?C.routeF:'#5d5d65');
    }
  }
  /* bande jaune du milieu */
  for(var b2=Math.floor(cam/140)*140;b2<cam+W+140;b2+=140){
    pt(b2-cam, SOL_BAS+22, 74, 10, '#d8c04a');
    pt(b2-cam, SOL_BAS+22, 74, 3, '#f0dc7a');
  }
  /* gravats, herbe qui perce, flaques */
  for(var g2=0;g2<decor.sol.length;g2++){
    var s=decor.sol[g2], gx2=s.x-cam;
    if(gx2<-40||gx2>W+40) continue;
    if(s.t===0){ pt(gx2,s.y,s.s,s.s*0.7,C.pierre); pt(gx2,s.y,s.s,3,C.pierreC); }
    else if(s.t===1){ pt(gx2,s.y,s.s,s.s*0.6,C.terre); }
    else if(s.t===2){ pt(gx2,s.y+4,s.s,4,C.herbe); pt(gx2+3,s.y,4,8,C.herbe); pt(gx2+9,s.y+2,4,6,C.herbeF); }
    else { pt(gx2,s.y,s.s*1.6,5,'rgba(90,140,170,.45)'); }
  }
  ctx.restore();
}

function dessineDevant(){
  /* epaves de voitures et lampadaires tordus, au sol */
  for(var e=0;e<decor.epaves.length;e++){
    var ep=decor.epaves[e], x=ep.x-cam;
    if(x<-160||x>W+160) continue;
    ombreSol(x+34,ep.y+2,86);
    pt(x, ep.y-26, 74, 26, ep.col);
    pt(x, ep.y-26, 74, 4, 'rgba(255,255,255,.25)');
    pt(x+14, ep.y-46, 42, 22, '#2f3540');
    pt(x+18, ep.y-42, 14, 12, '#7f9aa8');
    pt(x+ (ep.sens>0?58:2), ep.y-16, 14, 14, '#33333a');
    pt(x+ (ep.sens>0?4:56), ep.y-16, 14, 14, '#33333a');
    pt(x+ (ep.sens>0?70:-8), ep.y-24, 10, 10, C.feu2);
  }
  /* feux au sol */
  for(var f=0;f<decor.feux.length;f++){
    var fu=decor.feux[f], fx=fu.x-cam;
    if(fx<-60||fx>W+60) continue;
    var vac=Math.sin(temps*0.25+fu.x)*4;
    pt(fx-12, fu.y-10, 26, 10, '#4a4a4a');
    pt(fx-9, fu.y-26-vac, 18, 20, C.feu);
    pt(fx-5, fu.y-34-vac, 10, 14, C.feu2);
    pt(fx-2, fu.y-40-vac, 5, 8, '#fff6c2');
  }
}

/* ================= DESSIN ================= */
function dessine(){
  dessineMonde();
  var sx = secousse>0 ? (Math.random()*7-3.5) : 0;
  ctx.save(); ctx.translate(Math.round(sx),0);

  dessineDevant();

  /* barrage de gravats */
  var pa=porteActive();
  if(pa && !zoneVide(pa.zone)){
    var px3=pa.x-cam;
    if(px3>-160&&px3<W+160){
      for(var r=0;r<6;r++){
        pt(px3-30+(r%2)*14, SOL_HAUT-30+r*30, 56, 28, (r%2)?C.pierre:C.pierreF);
        pt(px3-30+(r%2)*14, SOL_HAUT-30+r*30, 56, 4, C.pierreC);
      }
      pt(px3-40, SOL_HAUT+120, 90, 26, C.terre);
      texteCadre('BATS-LES TOUS !', W/2, 84, C.feu2, 30, true);
    }
  }

  /* tri par profondeur */
  var liste=[];
  for(var i=0;i<coffres.length;i++) liste.push({y:coffres[i].y,k:'coffre',o:coffres[i]});
  for(var j=0;j<objets.length;j++) liste.push({y:objets[j].y,k:'objet',o:objets[j]});
  for(var k=0;k<ennemis.length;k++) liste.push({y:ennemis[k].y,k:'ennemi',o:ennemis[k]});
  if(boss && boss.pv>0) liste.push({y:boss.y,k:'boss',o:boss});
  liste.push({y:hero.y,k:'hero',o:hero});
  liste.sort(function(a,b){return a.y-b.y;});

  for(var n=0;n<liste.length;n++){
    var it=liste[n], ob=it.o, x;
    if(it.k==='coffre'){
      x=ob.x-cam; if(x<-90||x>W+90) continue;
      ombreSol(x,ob.y,54);
      if(ob.ouvert){
        blocNoir(x-24,ob.y-24,48,24,C.terreF);
        pt(x-24,ob.y-38,48,10,C.terre);
      }else{
        blocNoir(x-24,ob.y-40,48,40,C.terre);
        pt(x-24,ob.y-40,48,12,C.terreF);
        pt(x-24,ob.y-24,48,7,'#c9a227');
        pt(x-5,ob.y-22,10,10,'#f0dc7a');
        pt(x-24,ob.y-40,48,4,'#a5713f');
      }
    }else if(it.k==='objet'){
      x=ob.x-cam; if(x<-70||x>W+70) continue;
      var fl=Math.sin(ob.saut)*5;
      ombreSol(x,ob.y,34);
      blocNoir(x-16,ob.y-30+fl,32,26,C.blanc);
      pt(x-11,ob.y-25+fl,8,8,C.encre);
      pt(x+1,ob.y-25+fl,8,8,C.encre);
      pt(x-5,ob.y-15+fl,8,8,C.encre);
      pt(x-16,ob.y-30+fl,32,4,C.rose);
    }else if(it.k==='ennemi'){
      x=ob.x-cam; if(x<-110||x>W+110) continue;
      dessinePerso(x,ob.y,ob.w,ob.h,TYPES[ob.type].col,(hero.x>ob.x?1:-1),ob.pas,ob.flash,false,ob.frappe);
      /* le vert tient un caillou */
      if(ob.type==='vert'){
        var dd=(hero.x>ob.x?1:-1);
        pt(x+dd*30, ob.y-52 - (ob.frappe>0?8:0), 14,14, C.pierre);
      }
      var lw=38;
      pt(x-lw/2-3, ob.y-ob.h-22, lw+6, 12, C.encre);
      pt(x-lw/2, ob.y-ob.h-19, Math.max(2,lw*ob.pv/ob.pvmax), 6, TYPES[ob.type].col);
    }else if(it.k==='boss'){
      dessineBoss();
    }else{
      x=hero.x-cam;
      if(hero.inv>0 && Math.floor(hero.inv/5)%2===0){ /* clignote */ }
      else dessinePerso(x,hero.y,hero.w,hero.h,C.eau,hero.dir,hero.pas,0,true,hero.frappe);
      if(hero.frappe>0 && hero.muni<=0){
        var mx=hero.dir>0 ? x+30 : x-74;
        pt(mx,hero.y-56,44,12,'#6b4a2a');
        pt(hero.dir>0?mx+40:mx-16,hero.y-66,16,32,C.pierre);
        pt(hero.dir>0?mx+40:mx-16,hero.y-66,16,5,C.pierreC);
      }
    }
  }

  /* bulles du hero */
  for(var b3=0;b3<bulles.length;b3++){
    var bu=bulles[b3], bx3=bu.x-cam;
    if(bx3<-40||bx3>W+40) continue;
    pt(bx3-9,bu.y-9,18,18,C.encre);
    pt(bx3-6,bu.y-6,12,12,'#4b3a3a');
    pt(bx3-4,bu.y-4,4,4,C.blanc);
  }
  /* tirs ennemis */
  for(var t3=0;t3<tirs.length;t3++){
    var ti=tirs[t3], tx3=ti.x-cam;
    if(tx3<-40||tx3>W+40) continue;
    if(ti.type==='pelote'){
      pt(tx3-11,ti.y-11,22,22,C.roseF);
      pt(tx3-6,ti.y-6,12,12,C.rose);
      pt(tx3-9,ti.y-2,18,3,C.roseF);
    }else{
      pt(tx3-10,ti.y-10,20,20,C.pierreF);
      pt(tx3-7,ti.y-7,10,10,C.pierre);
    }
  }
  /* particules */
  for(var p2=0;p2<particules.length;p2++){
    var pp=particules[p2];
    pt(pp.x-cam,pp.y,pp.s,pp.s,pp.col);
  }

  /* sortie */
  if(boss && boss.pv<=0){
    var fx3=MONDE-70-cam;
    if(fx3<W+80){
      pt(fx3-6,SOL_HAUT-96,16,96,C.terre);
      pt(fx3+10,SOL_HAUT-96,64,40,C.herbe);
      pt(fx3+10,SOL_HAUT-96,64,5,'#7cc45c');
      texteCadre('SORTIE',fx3+42,SOL_HAUT-90,C.blanc,24,true);
    }
  }
  ctx.restore();
}

/* ================= BOUCLE ================= */
var precedent=0;
function boucle(t){
  var dt=(t-precedent)/16.6667;
  precedent=t;
  if(!isFinite(dt)||dt<=0) dt=1;
  if(dt>2.5) dt=2.5;
  try{ maj(dt); dessine(); }catch(err){ console.error(err); }
  requestAnimationFrame(boucle);
}

init();
requestAnimationFrame(boucle);
})();
</script>
