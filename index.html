<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Bubble Tim</title>
<style>
/* STYLE : CONSOLE 16 BITS */
:root{
  --ciel-clair:#9bd4ff; --ciel:#5aa9e6; --ciel-ombre:#3d7ebf;
  --herbe:#5aa832;
  --terre:#8b5a2b; --terre-ombre:#5c3a1a;
  --rouge:#e04f3d;
  --bleu:#3d7ede;
  --or:#ffe07a;
  --contour:#2b1b2e;
  --os:#f4f4ec;
  --pierre:#8f8f9a;
  --police:monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--ciel-ombre);color:var(--os);
     font-family:var(--police);font-weight:bold;
     display:flex;flex-direction:column;align-items:center;justify-content:center;
     gap:6px;padding:8px;overflow:hidden;
     -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}

#boite{display:flex;flex-direction:column;gap:6px;align-items:center;max-width:100%}

#hud{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;
     font-size:13px;text-transform:uppercase}
.jauge{border:3px solid var(--contour);background:#3a2f3f;width:130px;height:20px;position:relative}
.jauge i{display:block;height:100%;width:100%}
.jauge span{position:absolute;left:5px;top:2px;font-size:11px;color:var(--os)}
#vie i{background:var(--rouge)}
#nrj i{background:var(--bleu)}
.compteur{border:3px solid var(--contour);background:#3a2f3f;padding:2px 7px;
          font-size:12px;height:20px;display:flex;align-items:center}
.compteur b{color:var(--or);margin-left:5px}

#zonejeu{position:relative;border:3px solid var(--contour);line-height:0;background:#000}
canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;
       width:960px;height:672px}

#voile{position:absolute;inset:0;background:rgba(43,27,46,.92);
       display:flex;flex-direction:column;align-items:center;justify-content:center;
       gap:12px;text-align:center;padding:14px;color:var(--os)}
#voile.cache{display:none}
#voile h1{font-size:min(7vw,34px);color:var(--or);line-height:1.2;text-transform:uppercase;font-weight:bold}
#voile p{font-size:min(3.6vw,18px);line-height:1.6;color:var(--os)}
#voile .gros{font-size:min(4.4vw,22px);color:#8fd94a}

#pad{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;max-width:520px}
.croix{display:grid;grid-template-columns:repeat(3,50px);grid-template-rows:repeat(3,42px);gap:4px}
.tou{border:3px solid var(--contour);background:var(--pierre);color:var(--contour);
     font-family:var(--police);font-weight:bold;font-size:20px;cursor:pointer}
.tou:active{background:var(--herbe)}
#btaper{width:110px;height:88px;font-size:18px;background:var(--terre);color:var(--os)}
#btrejouer{height:42px;padding:0 10px;font-size:14px;background:var(--pierre);color:var(--contour)}
.vide{visibility:hidden;border:none;background:none}
#aide{font-size:12px;line-height:1.3;color:var(--os);text-align:center;text-transform:uppercase}
</style>
</head>
<body>

<div id="boite">

  <div id="hud">
    <div class="jauge" id="vie"><i></i><span>VIE</span></div>
    <div class="jauge" id="nrj"><i></i><span>ENERGIE</span></div>
    <div class="compteur">BULLES <b id="muni">15</b></div>
    <div class="compteur">SCORE <b id="score">0</b></div>
    <div class="compteur" id="msg">STAGE 1</div>
  </div>

  <div id="zonejeu">
    <canvas id="cv" width="320" height="224"></canvas>
    <div id="voile">
      <h1>BUBBLE TIM</h1>
      <p>Fleches ou ZQSD : bouger<br>Espace : tirer une bulle<br>Plus de bulles = la masse<br>R : recommencer</p>
      <p class="gros">Appuie sur une touche</p>
    </div>
  </div>

  <div id="pad">
    <div class="croix">
      <button class="tou vide"></button>
      <button class="tou" data-dir="haut">^</button>
      <button class="tou vide"></button>
      <button class="tou" data-dir="gauche">&lt;</button>
      <button class="tou vide"></button>
      <button class="tou" data-dir="droite">&gt;</button>
      <button class="tou vide"></button>
      <button class="tou" data-dir="bas">v</button>
      <button class="tou vide"></button>
    </div>
    <div style="display:flex;flex-direction:column;gap:8px;align-items:center">
      <button class="tou" id="btaper">TAPER</button>
      <button class="tou" id="btrejouer">REJOUER (R)</button>
    </div>
  </div>

  <div id="aide">Tue les ennemis pour avoir des bulles - ouvre les coffres pour l'energie</div>
</div>

<script>
(function(){
"use strict";

/* ================= BASES ================= */
var cv=document.getElementById('cv'), ctx=cv.getContext('2d');
ctx.imageSmoothingEnabled=false;
var W=960,H=540, SOL_HAUT=352, SOL_BAS=506, MONDE=4100;
var elVie=document.querySelector('#vie i'), elNrj=document.querySelector('#nrj i');
var elMuni=document.getElementById('muni'), elScore=document.getElementById('score');
var elMsg=document.getElementById('msg'), voile=document.getElementById('voile');

var C={
  cielHaut:'#79c2ff', cielBas:'#cfe9ff',
  herbe:'#5b9c3f', herbeF:'#417a2c',
  terre:'#7c4f2c', terreF:'#5d3a1f',
  pierre:'#8a8a8a', pierreF:'#6a6a6a', pierreC:'#a5a5a5',
  encre:'#2b2b2b', blanc:'#f2f2ec', route:'#57575e', routeF:'#43434a',
  feu:'#ff8a2b', feu2:'#ffd24a', fumee:'#b9b9b9',
  peau:'#f0c08a', cheveu:'#6b4322',
  bleu:'#3d8ad6', jaune:'#e8c020', rougeT:'#c0392b',
  vert:'#4f9e46', violet:'#8e5fc0', rose:'#ff8ec9', roseF:'#e05fa4',
  eau:'#3fc9d8'
};

/* ================= SON ================= */
var actx=null;
function son(f,d,type,vol){
  try{
    if(!actx) return;
    var o=actx.createOscillator(), g=actx.createGain();
    o.type=type||'square'; o.frequency.value=f;
    g.gain.value=vol||0.05;
    o.connect(g); g.connect(actx.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.0008, actx.currentTime+d);
    o.stop(actx.currentTime+d);
  }catch(e){}
}
function reveilleSon(){ try{ if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }

/* ================= HASARD FIXE ================= */
var graine=987654;
function rnd(){ graine=(graine*1103515245+12345)%2147483648; return graine/2147483648; }

/* ================= ETAT ================= */
var etat, hero, ennemis, bulles, tirs, objets, coffres, decor, portes, cam, score,
    msgTimer, secousse, boss, particules, temps;

var TYPES={
  bleu:   {col:C.bleu,   pv:2, vit:0.95, deg:4,  cd:80,  pts:10, chute:0.60, mode:'melee', nom:'BLEU'},
  jaune:  {col:C.jaune,  pv:3, vit:1.15, deg:6,  cd:70,  pts:20, chute:0.85, mode:'melee', nom:'JAUNE'},
  violet: {col:C.violet, pv:3, vit:1.85, deg:5,  cd:55,  pts:35, chute:0.90, mode:'melee', nom:'VIOLET'},
  vert:   {col:C.vert,   pv:2, vit:0.60, deg:6,  cd:115, pts:30, chute:1.00, mode:'tir',   nom:'VERT'},
  rouge:  {col:C.rougeT, pv:6, vit:0.80, deg:11, cd:72,  pts:50, chute:1.00, mode:'melee', nom:'ROUGE'}
};

function ajouteEnnemi(type,x,y,zone){
  ennemis.push({type:type,x:x,y:y,w:40,h:78,pv:TYPES[type].pv,pvmax:TYPES[type].pv,zone:zone,
                actif:false,cd:40+Math.floor(rnd()*50),flash:0,pousse:0,pas:rnd()*6,frappe:0});
}

function init(){
  graine=987654;
  etat='intro'; cam=0; score=0; msgTimer=0; secousse=0; temps=0;
  hero={x:120,y:450,w:44,h:78,dir:1,vie:100,nrj:100,muni:15,
        inv:0,pousse:0,frappe:0,pas:0,cd:0};
  ennemis=[]; bulles=[]; tirs=[]; objets=[]; coffres=[]; portes=[]; particules=[]; boss=null;

  /* --- zone 0 --- */
  ajouteEnnemi('bleu',560,420,0); ajouteEnnemi('bleu',760,485,0);
  ajouteEnnemi('bleu',960,400,0); ajouteEnnemi('jaune',1090,470,0);
  /* --- zone 1 --- */
  ajouteEnnemi('bleu',1450,410,1);  ajouteEnnemi('violet',1640,490,1);
  ajouteEnnemi('jaune',1860,430,1); ajouteEnnemi('vert',2060,395,1);
  ajouteEnnemi('jaune',2190,480,1); ajouteEnnemi('rouge',2320,440,1);
  /* --- zone 2 --- */
  ajouteEnnemi('violet',2650,420,2); ajouteEnnemi('jaune',2820,495,2);
  ajouteEnnemi('vert',2980,390,2);   ajouteEnnemi('rouge',3120,470,2);
  ajouteEnnemi('violet',3260,420,2); ajouteEnnemi('vert',3360,500,2);

  portes=[{x:1240,zone:0,ouverte:false},{x:2440,zone:1,ouverte:false},{x:3560,zone:2,ouverte:false}];

  var cx=[700,1560,2120,2560,2900,3300,3760], cy=[500,395,485,410,405,495,470];
  for(var i=0;i<cx.length;i++) coffres.push({x:cx[i],y:cy[i],ouvert:0});
  objets.push({x:3680,y:430,vie:1e9,saut:0});
  objets.push({x:3720,y:500,vie:1e9,saut:2});

  /* ---- decor ---- */
  decor={loin:[],pres:[],nuages:[],sol:[],feux:[],epaves:[]};
  var x=0;
  while(x<MONDE+900){
    var hh=140+rnd()*190, ww=100+rnd()*90;
    decor.loin.push({x:x,w:ww,h:hh,casse:Math.floor(rnd()*3),
                     col:rnd()>0.5?'#7f8a9c':'#6d7789', fen:Math.floor(rnd()*3)});
    x+=ww+18+rnd()*40;
  }
  x=-60;
  while(x<MONDE+900){
    var h2=90+rnd()*170, w2=110+rnd()*110;
    decor.pres.push({x:x,w:w2,h:h2,pal:rnd(),trou:rnd()>0.45,etages:Math.max(2,Math.floor(h2/44)),
                     effondre:rnd()>0.72});
    x+=w2+40+rnd()*90;
  }
  x=60;
  while(x<MONDE+900){ decor.nuages.push({x:x,y:26+rnd()*70,w:70+rnd()*70,h:18+rnd()*10}); x+=280+rnd()*260; }
  for(var j=0;j<210;j++){
    decor.sol.push({x:rnd()*(MONDE+400), y:SOL_HAUT+14+rnd()*(SOL_BAS-SOL_HAUT+18),
                    s:6+rnd()*14, t:Math.floor(rnd()*4)});
  }
  for(var f=0;f<16;f++) decor.feux.push({x:200+rnd()*(MONDE-200), y:SOL_HAUT-6+rnd()*30, s:0.7+rnd()*0.8});
  for(var e2=0;e2<14;e2++) decor.epaves.push({x:260+rnd()*(MONDE-300), y:SOL_HAUT+8+rnd()*120,
                                              col:rnd()>0.5?'#9c4b4b':'#4b6b9c', sens:rnd()>0.5?1:-1});
  majHud();
}

/* ================= ENTREES ================= */
var touches={}, attaqueDemandee=false;
function nomTouche(k){
  k=k.toLowerCase();
  if(k==='arrowleft'||k==='q'||k==='a') return 'gauche';
  if(k==='arrowright'||k==='d') return 'droite';
  if(k==='arrowup'||k==='z'||k==='w') return 'haut';
  if(k==='arrowdown'||k==='s') return 'bas';
  if(k===' '||k==='enter') return 'taper';
  if(k==='r') return 'rejouer';
  return null;
}
document.addEventListener('keydown',function(e){
  reveilleSon();
  var n=nomTouche(e.key);
  if(n) e.preventDefault();
  if(etat==='intro'){ voile.classList.add('cache'); etat='jeu'; return; }
  if(n==='rejouer'){ init(); voile.classList.add('cache'); etat='jeu'; return; }
  if(n==='taper'){ if(!e.repeat) attaqueDemandee=true; return; }
  if(n) touches[n]=true;
});
document.addEventListener('keyup',function(e){
  var n=nomTouche(e.key); if(n) touches[n]=false;
});
function brancheTouche(el,nom){
  function on(e){ e.preventDefault(); reveilleSon();
    if(etat==='intro'){ voile.classList.add('cache'); etat='jeu'; }
    if(nom==='taper') attaqueDemandee=true; else touches[nom]=true; }
  function off(e){ e.preventDefault(); if(nom!=='taper') touches[nom]=false; }
  el.addEventListener('pointerdown',on);
  el.addEventListener('pointerup',off);
  el.addEventListener('pointerleave',off);
  el.addEventListener('pointercancel',off);
  el.addEventListener('contextmenu',function(e){e.preventDefault();});
}
var boutonsDir=document.querySelectorAll('[data-dir]');
for(var i=0;i<boutonsDir.length;i++) brancheTouche(boutonsDir[i],boutonsDir[i].getAttribute('data-dir'));
brancheTouche(document.getElementById('btaper'),'taper');
document.getElementById('btrejouer').addEventListener('click',function(){
  reveilleSon(); init(); voile.classList.add('cache'); etat='jeu';
});
voile.addEventListener('pointerdown',function(){
  reveilleSon();
  if(etat==='intro'){ voile.classList.add('cache'); etat='jeu'; }
  else if(etat==='gagne'||etat==='perdu'){ init(); voile.classList.add('cache'); etat='jeu'; }
});

/* ================= HUD ================= */
function majHud(){
  elVie.style.width=Math.max(0,hero.vie)+'%';
  elNrj.style.width=Math.max(0,hero.nrj)+'%';
  elMuni.textContent=hero.muni>0?hero.muni:'MASSE';
  elScore.textContent=score;
}
function message(t){ elMsg.textContent=t; msgTimer=170; }

/* ================= OUTILS ================= */
function porteActive(){
  for(var i=0;i<portes.length;i++) if(!portes[i].ouverte) return portes[i];
  return null;
}
function zoneVide(z){
  if(z===2 && boss && boss.pv>0) return false;
  for(var i=0;i<ennemis.length;i++) if(ennemis[i].zone===z) return false;
  return true;
}
function poussiere(x,y,col,n){
  for(var i=0;i<n;i++){
    particules.push({x:x,y:y-30,vx:(Math.random()-0.5)*3.2,vy:-Math.random()*2.6,
                     vie:22+Math.random()*14,s:4+Math.random()*5,col:col});
  }
}

/* ================= ACTIONS ================= */
function attaque(){
  if(etat!=='jeu' || hero.cd>0) return;
  if(hero.muni>0){
    hero.muni--; hero.cd=14; hero.frappe=6;
    bulles.push({x:hero.x+hero.dir*26, y:hero.y-40, vx:hero.dir*9.5, vie:130});
    son(760,0.08,'square',0.05);
  }else{
    hero.cd=30; hero.frappe=17;
    son(150,0.14,'sawtooth',0.06);
    for(var i=ennemis.length-1;i>=0;i--){
      var e=ennemis[i];
      if(Math.abs(e.y-hero.y)<28 && (e.x-hero.x)*hero.dir>0 && Math.abs(e.x-hero.x)<64) blesseEnnemi(i,2,hero.dir*7);
    }
    if(boss && boss.pv>0 && Math.abs(boss.y-hero.y)<44 && (boss.x-hero.x)*hero.dir>0 && Math.abs(boss.x-hero.x)<96)
      blesseBoss(2);
    for(var c=0;c<coffres.length;c++){
      var cf=coffres[c];
      if(!cf.ouvert && Math.abs(cf.y-hero.y)<28 && Math.abs(cf.x-hero.x)<66) ouvreCoffre(cf);
    }
  }
  majHud();
}
function blesseEnnemi(idx,deg,pousse){
  var e=ennemis[idx];
  e.pv-=deg; e.flash=8; e.pousse=pousse; e.actif=true;
  poussiere(e.x,e.y,TYPES[e.type].col,4);
  if(e.pv<=0){
    score+=TYPES[e.type].pts;
    son(220,0.16,'square',0.05);
    poussiere(e.x,e.y,TYPES[e.type].col,10);
    if(rnd()<TYPES[e.type].chute) objets.push({x:e.x,y:e.y,vie:1200,saut:0});
    ennemis.splice(idx,1);
    secousse=6;
  }else son(420,0.05,'square',0.04);
  majHud();
}
function blesseBoss(deg){
  boss.pv-=deg; boss.flash=9;
  poussiere(boss.x,boss.y-20,C.rose,6);
  son(300,0.08,'square',0.05);
  if(boss.pv<=0){
    boss.pv=0; score+=400; secousse=18;
    poussiere(boss.x,boss.y-10,C.rose,26);
    son(160,0.6,'sawtooth',0.07);
    message('LE CHAT ROSE EST BATTU !');
    majHud();
  }
}
function ouvreCoffre(cf){
  cf.ouvert=1;
  hero.nrj=Math.min(100,hero.nrj+50);
  score+=5;
  poussiere(cf.x,cf.y,C.terre,8);
  message('ENERGIE +50');
  son(880,0.12,'triangle',0.06); son(1180,0.14,'triangle',0.05);
  majHud();
}

/* ================= MISE A JOUR ================= */
function maj(dt){
  temps+=dt;
  if(etat!=='jeu') return;
  if(msgTimer>0){ msgTimer-=dt; if(msgTimer<=0) elMsg.textContent='STAGE 1'; }
  if(secousse>0) secousse-=dt;

  /* --- hero --- */
  var vx=0, vy=0;
  if(touches.gauche) vx-=1;
  if(touches.droite) vx+=1;
  if(touches.haut) vy-=1;
  if(touches.bas) vy+=1;
  if(vx!==0) hero.dir=vx>0?1:-1;
  var bouge=(vx!==0||vy!==0);
  if(bouge && hero.nrj>0){
    var norm=(vx!==0&&vy!==0)?0.72:1;
    hero.x+=vx*2.6*norm*dt; hero.y+=vy*1.8*norm*dt;
    hero.pas+=0.34*dt; hero.nrj-=0.045*dt; if(hero.nrj<0) hero.nrj=0;
  }else if(bouge){
    hero.x+=vx*1.1*dt; hero.y+=vy*0.8*dt; hero.pas+=0.18*dt;
  }
  if(hero.nrj<=0){
    hero.vie-=0.05*dt;
    if(Math.floor(Date.now()/400)%2===0 && msgTimer<=0) elMsg.textContent='PLUS D ENERGIE !';
  }
  if(hero.pousse!==0){ hero.x+=hero.pousse*dt; hero.pousse*=0.82; if(Math.abs(hero.pousse)<0.2) hero.pousse=0; }
  if(hero.cd>0) hero.cd-=dt;
  if(hero.frappe>0) hero.frappe-=dt;
  if(hero.inv>0) hero.inv-=dt;

  /* --- apparition du boss --- */
  if(!boss && hero.x>3480){
    boss={x:3880,y:450,w:120,h:112,pv:20,pvmax:20,cd:120,tirCd:200,flash:0,pas:0,pousse:0,charge:0};
    message('LE CHAT ROSE !');
    son(200,0.4,'sawtooth',0.06);
  }

  /* --- portes --- */
  var pa=porteActive();
  var limite=MONDE-40;
  if(pa && !zoneVide(pa.zone)) limite=pa.x-30;
  else if(pa && zoneVide(pa.zone)){
    pa.ouverte=true; message('LA VOIE EST LIBRE !'); son(600,0.2,'triangle',0.05);
  }
  if(hero.x<40) hero.x=40;
  if(hero.x>limite) hero.x=limite;
  if(hero.y<SOL_HAUT) hero.y=SOL_HAUT;
  if(hero.y>SOL_BAS) hero.y=SOL_BAS;

  if(attaqueDemandee){ attaque(); attaqueDemandee=false; }

  var camMax=Math.max(0,limite+60-W);
  cam=Math.max(0,Math.min(camMax,hero.x-380));

  /* --- bulles du hero --- */
  for(var b=bulles.length-1;b>=0;b--){
    var bu=bulles[b]; bu.x+=bu.vx*dt; bu.vie-=dt;
    var touche=false;
    for(var i2=ennemis.length-1;i2>=0;i2--){
      var e2=ennemis[i2];
      if(Math.abs(bu.x-e2.x)<e2.w/2+8 && Math.abs(bu.y-(e2.y-34))<26){
        blesseEnnemi(i2,1,(bu.vx>0?1:-1)*4); touche=true; break;
      }
    }
    if(!touche && boss && boss.pv>0 && Math.abs(bu.x-boss.x)<boss.w/2 && Math.abs(bu.y-(boss.y-boss.h/2))<boss.h/2){
      blesseBoss(1); touche=true;
    }
    if(!touche){
      for(var c3=0;c3<coffres.length;c3++){
        var cf3=coffres[c3];
        if(!cf3.ouvert && Math.abs(bu.x-cf3.x)<28 && Math.abs(bu.y-(cf3.y-20))<26){ ouvreCoffre(cf3); touche=true; break; }
      }
    }
    if(touche||bu.vie<=0||bu.x<cam-80||bu.x>cam+W+80) bulles.splice(b,1);
  }

  /* --- tirs ennemis --- */
  for(var t2=tirs.length-1;t2>=0;t2--){
    var ti=tirs[t2];
    ti.x+=ti.vx*dt; ti.y+=(ti.vy||0)*dt; ti.vie-=dt; ti.rot=(ti.rot||0)+0.2*dt;
    if(hero.inv<=0 && Math.abs(ti.x-hero.x)<26 && Math.abs(ti.y-(hero.y-40))<30){
      hero.vie-=ti.deg; hero.inv=45; hero.pousse=(ti.vx>0?1:-1)*3.5; secousse=7;
      poussiere(hero.x,hero.y,C.blanc,6);
      son(120,0.14,'sawtooth',0.06); majHud();
      tirs.splice(t2,1); continue;
    }
    if(ti.vie<=0||ti.x<cam-90||ti.x>cam+W+90) tirs.splice(t2,1);
  }

  /* --- ennemis --- */
  for(var i=0;i<ennemis.length;i++){
    var e=ennemis[i], t=TYPES[e.type];
    if(!e.actif && Math.abs(e.x-hero.x)<540) e.actif=true;
    if(e.flash>0) e.flash-=dt;
    if(e.frappe>0) e.frappe-=dt;
    if(e.pousse!==0){ e.x+=e.pousse*dt; e.pousse*=0.8; if(Math.abs(e.pousse)<0.2) e.pousse=0; }
    if(!e.actif) continue;
    if(e.cd>0) e.cd-=dt;
    var dx=hero.x-e.x, dy=hero.y-e.y;

    if(t.mode==='tir'){
      /* garde ses distances et tire */
      var dist=Math.abs(dx);
      if(dist<190) e.x-=(dx>0?1:-1)*t.vit*1.3*dt;
      else if(dist>320) e.x+=(dx>0?1:-1)*t.vit*dt;
      if(Math.abs(dy)>10) e.y+=(dy>0?1:-1)*t.vit*0.8*dt;
      e.pas+=0.16*dt;
      if(e.cd<=0 && dist<430 && Math.abs(dy)<26){
        e.cd=t.cd; e.frappe=12;
        tirs.push({x:e.x+(dx>0?26:-26), y:e.y-40, vx:(dx>0?1:-1)*5.2, vy:0, deg:t.deg, vie:180, type:'caillou'});
        son(300,0.08,'square',0.04);
      }
    }else{
      var loin=Math.abs(dx)>34 || Math.abs(dy)>12;
      if(loin){
        if(Math.abs(dx)>32) e.x+=(dx>0?1:-1)*t.vit*dt;
        if(Math.abs(dy)>8)  e.y+=(dy>0?1:-1)*t.vit*0.65*dt;
        e.pas+=0.2*dt;
      }else if(e.cd<=0){
        e.cd=t.cd; e.frappe=12;
        if(hero.inv<=0){
          hero.vie-=t.deg; hero.inv=45; hero.pousse=(dx>0?1:-1)*4.5; secousse=8;
          poussiere(hero.x,hero.y,C.blanc,5);
          son(120,0.16,'sawtooth',0.06); majHud();
        }
      }
    }
    for(var k=0;k<ennemis.length;k++){
      if(k===i) continue;
      var o=ennemis[k];
      if(Math.abs(o.x-e.x)<28 && Math.abs(o.y-e.y)<14) e.x+=(e.x<o.x?-0.6:0.6)*dt;
    }
    if(e.y<SOL_HAUT) e.y=SOL_HAUT;
    if(e.y>SOL_BAS) e.y=SOL_BAS;
  }

  /* --- boss chat rose --- */
  if(boss && boss.pv>0){
    if(boss.flash>0) boss.flash-=dt;
    if(boss.cd>0) boss.cd-=dt;
    if(boss.tirCd>0) boss.tirCd-=dt;
    if(boss.pousse!==0){ boss.x+=boss.pousse*dt; boss.pousse*=0.85; if(Math.abs(boss.pousse)<0.2) boss.pousse=0; }
    var bdx=hero.x-boss.x, bdy=hero.y-boss.y;
    if(boss.charge>0){
      boss.charge-=dt;
      boss.x+=(boss.dirCharge)*4.2*dt;
      boss.pas+=0.5*dt;
      if(Math.abs(bdx)<70 && Math.abs(bdy)<38 && hero.inv<=0){
        hero.vie-=13; hero.inv=50; hero.pousse=(bdx>0?1:-1)*7; secousse=12;
        son(100,0.2,'sawtooth',0.07); majHud();
      }
    }else{
      if(Math.abs(bdx)>64) boss.x+=(bdx>0?1:-1)*1.05*dt;
      if(Math.abs(bdy)>10) boss.y+=(bdy>0?1:-1)*0.75*dt;
      boss.pas+=0.16*dt;
      if(boss.cd<=0 && Math.abs(bdx)<80 && Math.abs(bdy)<36){
        boss.cd=80;
        if(hero.inv<=0){
          hero.vie-=12; hero.inv=48; hero.pousse=(bdx>0?1:-1)*6; secousse=10;
          son(110,0.18,'sawtooth',0.06); majHud();
        }
      }
      if(boss.tirCd<=0){
        boss.tirCd=220;
        var sens=bdx>0?1:-1;
        for(var p=-1;p<=1;p++){
          tirs.push({x:boss.x+sens*40, y:boss.y-70, vx:sens*5.4, vy:p*1.1, deg:8, vie:190, type:'pelote'});
        }
        son(500,0.12,'square',0.05);
        if(Math.abs(bdx)>200){ boss.charge=48; boss.dirCharge=sens; }
      }
    }
    if(boss.x<3320) boss.x=3320;
    if(boss.x>MONDE-60) boss.x=MONDE-60;
    if(boss.y<SOL_HAUT+10) boss.y=SOL_HAUT+10;
    if(boss.y>SOL_BAS) boss.y=SOL_BAS;
  }

  /* --- objets --- */
  for(var o2=objets.length-1;o2>=0;o2--){
    var ob=objets[o2];
    ob.vie-=dt; ob.saut+=0.15*dt;
    if(Math.abs(ob.x-hero.x)<34 && Math.abs(ob.y-hero.y)<28){
      hero.muni+=5; score+=5; message('BULLES +5');
      son(980,0.09,'square',0.05); majHud();
      objets.splice(o2,1); continue;
    }
    if(ob.vie<=0) objets.splice(o2,1);
  }
  for(var c2=0;c2<coffres.length;c2++){
    var cf2=coffres[c2];
    if(!cf2.ouvert && Math.abs(cf2.x-hero.x)<34 && Math.abs(cf2.y-hero.y)<26) ouvreCoffre(cf2);
  }

  /* --- particules --- */
  for(var pa2=particules.length-1;pa2>=0;pa2--){
    var pp=particules[pa2];
    pp.x+=pp.vx*dt; pp.y+=pp.vy*dt; pp.vy+=0.18*dt; pp.vie-=dt;
    if(pp.vie<=0) particules.splice(pa2,1);
  }
  if(particules.length>140) particules.splice(0,particules.length-140);

  /* --- fin --- */
  if(hero.vie<=0){ hero.vie=0; etat='perdu'; finEcran(false); }
  else if(boss && boss.pv<=0 && hero.x>MONDE-120){ etat='gagne'; finEcran(true); }
  majHud();
}

function finEcran(gagne){
  voile.classList.remove('cache');
  voile.innerHTML = gagne
    ? '<h1>BUBBLE TIM A GAGNE !</h1><p>Le chat rose est battu<br>Score : '+score+'</p><p class="gros">Appuie sur R</p>'
    : '<h1 style="color:#ff7a6b">TIM EST TOMBE</h1><p>Score : '+score+'</p><p class="gros">Appuie sur R</p>';
  son(gagne?880:110, 0.5, gagne?'triangle':'sawtooth', 0.07);
}

/* ================= RENDU CONSOLE 16 BITS ================= */
/* Le jeu tourne dans son ancien espace (960 de large a l'ecran, sol a 352).
   On dessine dans un canevas virtuel de 320 x 224 : tout est divise par 3. */
var VW=320, VH=224, ECH=3;
var SOL=Math.round(SOL_HAUT/ECH);    /* 117 */
var SOLB=Math.round(SOL_BAS/ECH);    /* 169 */

var P={
  ciel:['#9bd4ff','#5aa9e6','#3d7ebf'],
  herbe:['#8fd94a','#5aa832','#2f6b1e'],
  terre:['#c08b4f','#8b5a2b','#5c3a1a'],
  peau:['#ffd9a0','#e8a76a','#a86b3c'],
  rouge:['#ff8a7a','#e04f3d','#8f2618'],
  bleu:['#7fb8ff','#3d7ede','#24487f'],
  jaune:['#ffe07a','#e8b020','#9c7410'],
  violet:['#c99be6','#8e5fc0','#573a7a'],
  vert:['#8fd94a','#5aa832','#2f6b1e'],
  eau:['#a7ecf2','#3fc9d8','#237e88'],
  rose:['#ffc0e0','#ff74b4','#b8467f'],
  pierre:['#cfcfd8','#8f8f9a','#565662'],
  route:['#6f6f7b','#4c4c56','#33333c'],
  os:['#f4f4ec','#d0d0c6','#9a9a90'],
  feu:['#ffe45c','#ff8a2b','#d0441a'],
  loin:['#7a7ca8','#5f6188','#454768'],
  pres:['#9a8fac','#7a6f8e','#57506a'],
  or:['#ffe08a','#e8b020','#9c7410']
};
var CT='#2b1b2e';
var PENN={bleu:P.bleu,jaune:P.jaune,violet:P.violet,vert:P.vert,rouge:P.rouge};

function ri(v){ return Math.round(v); }
function fr(x,y,w,h,c){
  x=ri(x); y=ri(y); w=ri(w); h=ri(h);
  if(w<=0||h<=0) return;
  ctx.fillStyle=c; ctx.fillRect(x,y,w,h);
}
function outline(x,y,w,h){ fr(x-1,y-1,ri(w)+2,ri(h)+2,CT); }

/* bloc ombre 3 tons : lumiere en haut a gauche, ombre en bas a droite */
function shade(x,y,w,h,pal,cont){
  x=ri(x); y=ri(y); w=ri(w); h=ri(h);
  if(w<=0||h<=0) return;
  if(cont!==false) fr(x-1,y-1,w+2,h+2,CT);
  fr(x,y,w,h,pal[1]);
  var t=Math.max(1,Math.round(h*0.28));
  var b=Math.max(1,Math.round(h*0.28));
  fr(x,y,w,t,pal[0]);
  fr(x,y+h-b,w,b,pal[2]);
  var l=Math.max(1,Math.round(w*0.18));
  if(h-b>t){ fr(x,y+t,l,h-b-t,pal[0]); fr(x+w-l,y+t,l,h-b-t,pal[2]); }
}

/* tramage (dithering) : damier de deux couleurs, mis en cache */
var _pat={};
function dpat(a,b){
  var k=a+'|'+b; if(_pat[k]) return _pat[k];
  var c=document.createElement('canvas'); c.width=2; c.height=2;
  var g=c.getContext('2d');
  g.fillStyle=a; g.fillRect(0,0,2,2);
  g.fillStyle=b; g.fillRect(0,0,1,1); g.fillRect(1,1,1,1);
  var p=ctx.createPattern(c,'repeat'); _pat[k]=p; return p;
}
function dband(x,y,w,h,a,b){ ctx.fillStyle=dpat(a,b); ctx.fillRect(ri(x),ri(y),ri(w),ri(h)); }

function txt(t,x,y,col,size,center){
  ctx.font='bold '+(size||8)+"px monospace";
  ctx.textAlign=center?'center':'left';
  ctx.textBaseline='top';
  ctx.fillStyle=CT;
  ctx.fillText(t,ri(x),ri(y)+1);
  ctx.fillText(t,ri(x)+1,ri(y));
  ctx.fillStyle=col;
  ctx.fillText(t,ri(x),ri(y));
}

/* ---- personnage (heros ou ennemi) ---- */
function perso(cx,base,pal,dir,pas,flash,estHero,frappe){
  cx=Math.round(cx);
  base=Math.round(base)+Math.round(Math.sin(temps*0.12+cx*0.3));
  var w=13,h=26;
  var gx=cx-7, gy=base-h;
  var body=flash>0?P.os:(pal||P.bleu);
  var pant=flash>0?P.os:P.route;
  var step=Math.floor(pas)&1;
  fr(cx-6,base,12,1,P.route[2]);
  var l1=step?1:0, l2=step?0:1;
  shade(gx+1, base-7+l1, 4, 7-l1, pant);
  shade(gx+8, base-7+l2, 4, 7-l2, pant);
  shade(gx, gy+9, w, 10, body);
  shade(gx+2, gy, 9, 10, flash>0?P.os:P.peau);
  fr(gx+1, gy-1, 11, 3, estHero?'#6b4322':CT);
  var ex=dir>0?1:0;
  fr(gx+3+ex, gy+4, 1,2, CT);
  fr(gx+6+ex, gy+4, 1,2, CT);
  if(estHero){
    var bx=dir>0?gx+w+1:gx-6;
    var by=gy+9-(frappe>0?2:0);
    outline(bx,by,5,9);
    fr(bx,by,5,9,P.os[1]); fr(bx,by,5,3,P.os[0]);
    fr(bx,by+5,5,4,P.rose[1]);
    fr(bx+1,by+6,1,1,CT); fr(bx+3,by+6,1,1,CT);
    fr(bx+2,by-3,1,4,P.eau[1]);
  }
}

function dessineBoss(){
  var bx=Math.round((boss.x-cam)/ECH), by=Math.round(boss.y/ECH);
  var fl=Math.round(Math.sin(boss.pas*0.4));
  var pal=boss.flash>0?P.os:P.rose;
  fr(bx-16,by,32,1,P.route[2]);
  /* corps */
  shade(bx-15, by-22+fl, 30, 20, pal);
  fr(bx-9, by-19+fl, 3, 13, P.rose[2]);
  fr(bx-1, by-19+fl, 3, 13, P.rose[2]);
  fr(bx+7, by-19+fl, 3, 13, P.rose[2]);
  /* pattes */
  shade(bx-13, by-3+fl, 7, 4, pal);
  shade(bx+6,  by-3+fl, 7, 4, pal);
  /* queue */
  var qs=hero.x>boss.x?-1:1;
  for(var q=0;q<3;q++) fr(bx+qs*(16+q*4), by-14+fl-q*4, 4,4, P.rose[1]);
  /* tete */
  var hx=bx-12, hy=by-40+fl;
  fr(hx+1,hy-4,5,5,pal[1]); fr(hx+18,hy-4,5,5,pal[1]);
  fr(hx+2,hy-3,2,2,P.rose[2]); fr(hx+19,hy-3,2,2,P.rose[2]);
  shade(hx,hy,24,18,pal);
  fr(hx+4,hy+6,6,5,P.os[0]); fr(hx+14,hy+6,6,5,P.os[0]);
  var vx2=hero.x>boss.x?2:0;
  fr(hx+6+vx2,hy+7,3,4,CT); fr(hx+16+vx2,hy+7,3,4,CT);
  fr(hx+9,hy+13,6,3,P.os[0]);
  fr(hx-3,hy+11,4,1,CT); fr(hx-3,hy+14,4,1,CT);
  fr(hx+23,hy+11,4,1,CT); fr(hx+23,hy+14,4,1,CT);
  fr(hx+9,hy+16,2,2,P.os[0]); fr(hx+13,hy+16,2,2,P.os[0]);
  /* barre de vie du boss */
  var bw=180, bx3=Math.round((VW-bw)/2), frac=Math.max(0,boss.pv)/boss.pvmax;
  fr(bx3-2,6,bw+4,9,CT);
  fr(bx3,8,bw,5,P.route[1]);
  fr(bx3,8,Math.round(bw*frac),5,P.rose[1]);
  fr(bx3,8,Math.round(bw*frac),2,P.rose[0]);
  txt('LE CHAT ROSE', VW/2, 16, P.os[0], 8, true);
}

/* ---- fond : ciel + parallaxe ville + route ---- */
function dessineMonde(){
  var h1=Math.round(SOL*0.42), h2=Math.round(SOL*0.74);
  fr(-2,-2,VW+4,h1+2,P.ciel[0]);
  dband(-2,h1-2,VW+4,4,P.ciel[0],P.ciel[1]);
  fr(-2,h1+2,VW+4,h2-h1-2,P.ciel[1]);
  dband(-2,h2-2,VW+4,4,P.ciel[1],P.ciel[2]);
  fr(-2,h2+2,VW+4,SOL-h2,P.ciel[2]);

  /* soleil carre */
  fr(VW-42,10,14,14,P.feu[0]);
  fr(VW-40,12,10,10,P.feu[1]);

  /* nuages (parallaxe lente) */
  for(var n=0;n<decor.nuages.length;n++){
    var nu=decor.nuages[n];
    var nx=Math.round((nu.x-cam*0.12)/ECH);
    if(nx>VW+40||nx<-70) continue;
    var ny=Math.round(nu.y/ECH)+3, nw=Math.max(8,Math.round(nu.w/ECH));
    fr(nx,ny,nw,4,P.os[0]);
    fr(nx+3,ny-3,nw-8,3,P.os[0]);
    fr(nx,ny+4,nw,1,P.os[1]);
  }

  /* ville lointaine (parallaxe 0.25) */
  for(var i=0;i<decor.loin.length;i++){
    var d=decor.loin[i];
    var x=Math.round((d.x-cam*0.25)/ECH);
    var w=Math.max(6,Math.round(d.w/ECH));
    if(x>VW+30||x+w<-30) continue;
    var bh=Math.round(d.h/ECH), top=SOL-bh;
    fr(x,top,w,bh,P.loin[1]);
    fr(x,top,w,2,P.loin[0]);
    fr(x,top,2,bh,P.loin[0]);
    fr(x+w-2,top,2,bh,P.loin[2]);
    fr(x,top,Math.round(w*0.4),2,P.ciel[2]);
    for(var wy=top+3; wy<SOL-3; wy+=6){
      for(var wx=x+2; wx<x+w-3; wx+=5){
        fr(wx,wy,2,3, ((wx+wy)&3)?P.loin[2]:P.jaune[2]);
      }
    }
  }

  /* immeubles proches (parallaxe 0.55) */
  for(var j=0;j<decor.pres.length;j++){
    var p=decor.pres[j];
    var px=Math.round((p.x-cam*0.55)/ECH);
    var pw=Math.max(10,Math.round(p.w/ECH));
    if(px>VW+40||px+pw<-40) continue;
    var ph=Math.round(p.h/ECH), ptop=SOL-ph;
    shade(px,ptop,pw,ph,P.pres,false);
    if(p.effondre) fr(px,ptop,Math.round(pw*0.5),3,P.ciel[2]);
    for(var ey=ptop+4; ey<SOL-4; ey+=8){
      for(var ex2=px+3; ex2<px+pw-4; ex2+=7){
        fr(ex2,ey,4,5,'#2f3540');
        fr(ex2,ey,4,1,P.pres[2]);
        if((ex2+ey)&4) fr(ex2+1,ey+1,2,2,P.ciel[1]);
      }
    }
    fr(px+Math.round(pw*0.42), SOL-6, 5, 6, P.terre[2]);
  }

  /* la route */
  fr(-2,SOL,VW+4,VH-SOL+4,P.route[1]);
  fr(-2,SOL,VW+4,2,P.route[0]);
  var off=Math.round(cam/ECH)%16;
  for(var ry=SOL+3; ry<VH; ry+=8){
    var dec=((Math.floor((ry-SOL)/8)&1)?8:0);
    for(var rx=-16; rx<VW+16; rx+=16){
      var qx=rx-off+dec;
      fr(qx,ry,7,6, ((qx+ry)&8)?P.route[2]:P.route[1]);
    }
  }
  /* herbe / gravats / flaques */
  for(var g=0;g<decor.sol.length;g++){
    var s=decor.sol[g];
    var gx=Math.round((s.x-cam)/ECH);
    if(gx<-8||gx>VW+8) continue;
    var gy=Math.round(s.y/ECH);
    if(s.t===2){ fr(gx,gy,2,3,P.herbe[1]); fr(gx+1,gy-2,1,2,P.herbe[0]); }
    else if(s.t===0){ fr(gx,gy,3,2,P.pierre[1]); fr(gx,gy,3,1,P.pierre[0]); }
    else if(s.t===1){ fr(gx,gy,2,2,P.terre[1]); }
    else { fr(gx,gy,4,1,P.ciel[2]); }
  }
  /* bande jaune du milieu */
  for(var b=Math.floor(cam/140)*140; b<cam+W+140; b+=140){
    var yx=Math.round((b-cam)/ECH);
    if(yx<-14||yx>VW+14) continue;
    fr(yx, SOLB+8, 12,3, P.jaune[1]);
    fr(yx, SOLB+8, 12,1, P.jaune[0]);
  }
}

/* ---- premier plan : epaves + feux ---- */
function dessineDevant(){
  for(var e=0;e<decor.epaves.length;e++){
    var ep=decor.epaves[e];
    var x=Math.round((ep.x-cam)/ECH);
    if(x<-30||x>VW+30) continue;
    var y=Math.round(ep.y/ECH);
    var pal=ep.col==='#9c4b4b'?P.rouge:P.bleu;
    fr(x-2,y,20,1,P.route[2]);
    shade(x,y-8,18,7,pal);
    shade(x+4,y-13,10,5,P.pierre);
    fr(x+(ep.sens>0?14:1), y-3, 3,3, CT);
    fr(x+(ep.sens>0?1:14), y-3, 3,3, CT);
  }
  for(var f=0;f<decor.feux.length;f++){
    var fu=decor.feux[f];
    var x2=Math.round((fu.x-cam)/ECH);
    if(x2<-16||x2>VW+16) continue;
    var y2=Math.round(fu.y/ECH);
    var vac=Math.round(Math.sin(temps*0.15+fu.x));
    fr(x2-4,y2-2,9,3,P.route[2]);
    fr(x2-3,y2-8-vac,6,7,P.feu[2]);
    fr(x2-2,y2-11-vac,4,5,P.feu[1]);
    fr(x2-1,y2-14-vac,2,4,P.feu[0]);
  }
}

/* ================= DESSIN ================= */
function dessine(){
  var shx=0, shy=0;
  if(secousse>0){ shx=Math.round(Math.random()*2-1); shy=Math.round(Math.random()*2-1); }
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,VW,VH);
  ctx.save();
  ctx.translate(shx,shy);

  dessineMonde();
  dessineDevant();

  /* barrage de gravats devant la porte */
  var pa=porteActive();
  if(pa && !zoneVide(pa.zone)){
    var px=Math.round((pa.x-cam)/ECH);
    if(px>-30 && px<VW+30){
      for(var r=0;r<6;r++) shade(px-8+(r&1)*4, SOL-6+r*7, 16, 8, P.pierre);
      txt('BATS-LES TOUS !', VW/2, 26, P.feu[0], 8, true);
    }
  }

  /* tri par profondeur */
  var liste=[];
  for(var i=0;i<coffres.length;i++) liste.push({y:coffres[i].y,k:'c',o:coffres[i]});
  for(var j=0;j<objets.length;j++) liste.push({y:objets[j].y,k:'o',o:objets[j]});
  for(var k=0;k<ennemis.length;k++) liste.push({y:ennemis[k].y,k:'e',o:ennemis[k]});
  if(boss && boss.pv>0) liste.push({y:boss.y,k:'b',o:boss});
  liste.push({y:hero.y,k:'h',o:hero});
  liste.sort(function(a,b){return a.y-b.y;});

  for(var n=0;n<liste.length;n++){
    var it=liste[n], ob=it.o, x;
    if(it.k==='c'){
      x=Math.round((ob.x-cam)/ECH); if(x<-20||x>VW+20) continue;
      var cy=Math.round(ob.y/ECH);
      if(ob.ouvert){
        shade(x-6,cy-4,12,4,P.terre);
      }else{
        shade(x-6,cy-9,12,9,P.terre);
        fr(x-6,cy-5,12,2,P.or[1]);
        fr(x-1,cy-4,2,2,P.or[0]);
      }
    }else if(it.k==='o'){
      x=Math.round((ob.x-cam)/ECH); if(x<-16||x>VW+16) continue;
      var fl=Math.round(Math.sin(ob.saut));
      var oy=Math.round(ob.y/ECH)-6+fl;
      outline(x-3,oy,6,7);
      fr(x-3,oy,6,7,P.os[1]); fr(x-3,oy,6,2,P.os[0]);
      fr(x-2,oy+3,4,3,P.rose[1]);
      fr(x-2,oy+4,1,1,CT); fr(x+1,oy+4,1,1,CT);
    }else if(it.k==='e'){
      x=Math.round((ob.x-cam)/ECH); if(x<-24||x>VW+24) continue;
      var ey=Math.round(ob.y/ECH);
      perso(x,ey,PENN[ob.type],(hero.x>ob.x?1:-1),ob.pas,ob.flash,false,ob.frappe);
      if(ob.type==='vert'){
        var dd=(hero.x>ob.x?1:-1);
        fr(x+dd*8, ey-18-(ob.frappe>0?2:0), 4,4, P.pierre[1]);
      }
      var lw=14, frac=Math.max(0,ob.pv)/ob.pvmax;
      fr(x-lw/2-1, ey-31, lw+2, 3, CT);
      fr(x-lw/2, ey-30, Math.max(1,Math.round(lw*frac)), 1, PENN[ob.type][0]);
    }else if(it.k==='b'){
      dessineBoss();
    }else{
      x=Math.round((hero.x-cam)/ECH);
      if(!(hero.inv>0 && Math.floor(hero.inv/4)%2===0))
        perso(x, Math.round(hero.y/ECH), P.eau, hero.dir, hero.pas, 0, true, hero.frappe);
      if(hero.frappe>0 && hero.muni<=0){
        var hy=Math.round(hero.y/ECH);
        var mx=hero.dir>0? x+7 : x-14;
        fr(mx, hy-20, 13, 3, P.terre[1]);
        fr(hero.dir>0?mx+11:mx-4, hy-24, 5, 10, P.pierre[1]);
      }
    }
  }

  /* bulles du heros */
  for(var b3=0;b3<bulles.length;b3++){
    var bu=bulles[b3], bx4=Math.round((bu.x-cam)/ECH), byy=Math.round(bu.y/ECH);
    if(bx4<-8||bx4>VW+8) continue;
    outline(bx4-2,byy-2,4,4);
    fr(bx4-2,byy-2,4,4,P.eau[1]);
    fr(bx4-2,byy-2,2,2,P.eau[0]);
    fr(bx4-1,byy-1,1,1,P.os[0]);
  }
  /* tirs ennemis */
  for(var t3=0;t3<tirs.length;t3++){
    var ti=tirs[t3], tx4=Math.round((ti.x-cam)/ECH), tyy=Math.round(ti.y/ECH);
    if(tx4<-8||tx4>VW+8) continue;
    var tp=ti.type==='pelote'?P.rose:P.pierre;
    outline(tx4-3,tyy-3,6,6);
    fr(tx4-3,tyy-3,6,6,tp[1]);
    fr(tx4-3,tyy-3,3,3,tp[0]);
  }
  /* particules */
  for(var p2=0;p2<particules.length;p2++){
    var pp=particules[p2], s=Math.max(1,Math.round(pp.s/ECH));
    fr((pp.x-cam)/ECH, pp.y/ECH, s, s, pp.col);
  }

  /* sortie */
  if(boss && boss.pv<=0){
    var fx3=Math.round((MONDE-70-cam)/ECH);
    if(fx3<VW+20){
      fr(fx3-2,SOL-32,3,32,P.terre[1]);
      shade(fx3+1,SOL-32,22,14,P.herbe);
      txt('SORTIE',fx3+12,SOL-28,P.os[0],8,true);
    }
  }

  ctx.restore();
}

/* ================= AGRANDISSEMENT ENTIER ================= */
function ajuste(){
  var s=4;
  var aw=window.innerWidth-24;
  var ah=window.innerHeight-230;
  while(s>1 && (VW*s>aw || VH*s>ah)) s--;
  cv.style.width=(VW*s)+'px';
  cv.style.height=(VH*s)+'px';
}
window.addEventListener('resize',ajuste);

/* ================= BOUCLE ================= */
var precedent=0;
function boucle(t){
  var dt=(t-precedent)/16.6667;
  precedent=t;
  if(!isFinite(dt)||dt<=0) dt=1;
  if(dt>2.5) dt=2.5;
  try{ maj(dt); dessine(); }catch(err){ console.error(err); }
  requestAnimationFrame(boucle);
}

ajuste();
init();
requestAnimationFrame(boucle);
})();
</script>
